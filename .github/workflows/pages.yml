name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_mail:
        description: 'Send the indicators e-mail even if nothing needs attention'
        type: boolean
        default: false
  # Daily rebuild picks up new indicator values (06:17 in Minsk)
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Never fails the deploy: an unreachable source keeps the last known value
      - name: Refresh indicator values
        run: python3 tools/update_pokazateli.py
      - name: Build inner pages, sitemap and robots.txt
        run: python3 build.py
      # Only the site itself is published: sources in _src/, build.py and README stay out of reach of crawlers
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html 404.html styles.css script.js robots.txt sitemap.xml .nojekyll assets findir rekvizity pokazateli privacy _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  # On Monday's scheduled run (or a manual one) e-mails a reminder if a hand-kept value is due within two weeks
  # or an automatic source failed. Needs repository secrets MAIL_USERNAME (the Gmail address that sends and
  # receives the reminder) and MAIL_PASSWORD (a Gmail app password); without them the mail step is skipped.
  notify:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Check indicators
        id: report
        run: |
          if [ "${{ github.event_name }}" = schedule ] && [ "$(date +%u)" != 1 ]; then echo "Reminders go out on Mondays"; exit 0; fi
          python3 tools/update_pokazateli.py --report report.txt ${{ inputs.test_mail && '--always' || '' }}
          if [ -f report.txt ]; then echo "send=yes" >> "$GITHUB_OUTPUT"; fi
      - name: E-mail the reminder
        if: steps.report.outputs.send == 'yes' && env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: БалансПро сайт <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_USERNAME }}
          subject: 'БалансПро: пора обновить показатели на сайте'
          body: file://report.txt
