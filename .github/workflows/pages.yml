name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build inner pages, sitemap and robots.txt
        run: python3 build.py
      # Only the site itself is published: sources in _src/, build.py and README stay out of reach of crawlers
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html 404.html styles.css script.js robots.txt sitemap.xml .nojekyll assets findir rekvizity privacy _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
