name: Update /v2/ on the site

# This branch is published at /v2/ by the Pages workflow in main.
# Pages deploys only from main, so a push here just restarts that workflow.
on:
  push:
    branches: [variant-2]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Run the Pages deploy from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
